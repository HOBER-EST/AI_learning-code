name: Desktop app

# Builds the stand-alone desktop app on Windows, macOS and Linux.
# - Every run uploads the packages as workflow artifacts.
# - Pushing a tag like v1.0.0 also publishes them on a GitHub Release.
# Branch pushes only build when the packaging itself changes (macOS runner
# minutes are expensive); tag pushes and manual runs always build.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller pywebview

      - name: Build desktop app
        run: python desktop/build.py

      - name: Smoke test the packaged app
        run: python desktop/smoke_test.py

      # Linux users fall back to the browser when GTK/Qt web views are missing;
      # Windows and macOS must get a real app window.
      - name: Check the native window opens
        if: runner.os != 'Linux'
        run: python desktop/check_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: Learn61A-${{ runner.os }}
          path: desktop/release/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 61A 递归实验室 ${{ github.ref_name }}
          body_path: desktop/RELEASE_NOTES.md
          files: desktop/release/*
