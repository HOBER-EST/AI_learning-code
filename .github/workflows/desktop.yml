name: Desktop app

# Builds the stand-alone desktop app on Windows, macOS and Linux.
# - Every run uploads the packages as workflow artifacts.
# - Pushing a tag like v1.0.0 also publishes them on a GitHub Release.
# Branch pushes only build when the packaging itself changes (macOS runner
# minutes are expensive); tag pushes and manual runs always build.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller pywebview

      - name: Build desktop app
        run: python desktop/build.py

      - name: Smoke test the packaged app
        run: python desktop/smoke_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: Learn61A-${{ runner.os }}
          path: desktop/release/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*
